name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          check-latest: false

      - name: Verify environment
        shell: pwsh
        run: |
          Write-Host "Node:"
          node --version

          Write-Host "npm:"
          npm --version

          Write-Host "dotnet:"
          dotnet --version

      - name: Find MSBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe não encontrado."
          }

          $msbuild = (
            & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.Component.MSBuild `
              -find "MSBuild\**\Bin\MSBuild.exe" |
              Select-Object -First 1
          ).Trim()

          if (-not $msbuild) {
            throw "MSBuild.exe não encontrado."
          }

          Write-Host "MSBuild encontrado:"
          Write-Host $msbuild

          $msbuildDir = Split-Path $msbuild -Parent

          $msbuildDir | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          $env:PATH = "$msbuildDir;$env:PATH"

          Write-Host "Versão do MSBuild:"
          & $msbuild -version

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --no-audit --no-fund

      - name: Patch react-native-fs
        shell: pwsh
        run: |
          node tools/patch-rnfs.js

      - name: Generate Windows project
        shell: pwsh
        run: |
          npx react-native init-windows `
            --template cpp-app `
            --overwrite `
            --no-telemetry `
            --logging

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          npm run prepare-windows-assets

      - name: Autolink Windows
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --no-telemetry

      - name: Build Windows ReleaseBundle
        shell: pwsh
        run: |
          npm run windows

      - name: Find executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Procurando GiroVendasDesktop.exe..."

          $exe = Get-ChildItem `
            -Path windows `
            -Recurse `
            -Filter "GiroVendasDesktop.exe" `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host ""
            Write-Host "Executáveis encontrados:"

            Get-ChildItem `
              -Path windows `
              -Recurse `
              -Filter "*.exe" `
              -File |
              Select-Object FullName |
              Format-Table -AutoSize

            throw "GiroVendasDesktop.exe não foi encontrado."
          }

          Write-Host "EXE encontrado:"
          Write-Host $exe.FullName

          $artifactRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts"

          $portable = Join-Path `
            $artifactRoot `
            "GiroVendasDesktop-Windows-x64"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $portable |
            Out-Null

          Copy-Item `
            -Path (Join-Path $exe.Directory.FullName "*") `
            -Destination $portable `
            -Recurse `
            -Force

          $zipPath = Join-Path `
            $artifactRoot `
            "GiroVendasDesktop-Windows-x64.zip"

          Compress-Archive `
            -Path (Join-Path $portable "*") `
            -DestinationPath $zipPath `
            -Force

          Write-Host ""
          Write-Host "Build portátil criada:"
          Write-Host $zipPath

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GiroVendasDesktop-Windows-x64
          path: artifacts/GiroVendasDesktop-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
